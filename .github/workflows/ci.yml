name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A run for the same ref supersedes the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Site and admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATA_DIR: ${{ runner.temp }}/vitaqueen-data
      APP_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The same commands the installer runs on a server, against a fresh
      # database: migrations apply, an admin can be created, and a second
      # --if-none run is a no-op.
      - name: Database CLI
        run: |
          npm run db:migrate
          npm run db:admin -- --email ci@example.com --password 'ci-password-0123'
          npm run db:admin -- --if-none --email other@example.com | grep -q 'already exist'
          npm run db:backup -- --to "$RUNNER_TEMP/backup.db"

      - name: Build
        run: npm run build
