name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A run for the same ref supersedes the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Builds with no API reachable, which is the point: the site must build
      # from seeded content alone.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath, gd, redis
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test
        env:
          APP_ENV: testing
