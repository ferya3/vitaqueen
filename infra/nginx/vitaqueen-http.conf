# ---------------------------------------------------------------------------
# VitaQueen — minimal plain-HTTP reverse proxy.
#
# Installed by `WITH_NGINX=1 infra/scripts/install-ubuntu.sh` so a fresh server
# can be reached on port 80 by IP while it is being set up. It is not the
# production configuration: no TLS, no Cloudflare allow-list. Move to
# infra/nginx/vitaqueen.conf before the site goes live (docs/security.md).
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=vq_pages:10m rate=30r/s;
map $request_method $vq_form_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $vq_form_key zone=vq_forms:10m rate=2r/s;

map $http_upgrade $vq_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /admin {
        client_max_body_size 40m;
        limit_req zone=vq_forms burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=vq_pages burst=60 nodelay;
        limit_req zone=vq_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vq_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }
}
