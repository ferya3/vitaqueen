# ---------------------------------------------------------------------------
# VitaQueen — origin nginx
#
# Sits behind Cloudflare. Two server blocks: the Next.js front end on the apex,
# and the Laravel API on its own hostname. The database and Redis are not
# reachable from here at all — see docs/security.md.
#
#   Internet → Cloudflare (WAF, DDoS, cache) → nginx → Next.js / PHP-FPM
# ---------------------------------------------------------------------------

# Only Cloudflare may reach the origin. Everything else gets a 403 before it
# touches an application process. Refresh from
# https://www.cloudflare.com/ips-v4 and /ips-v6 with the deploy script.
include /etc/nginx/cloudflare-ips.conf;   # set_real_ip_from … ;
real_ip_header CF-Connecting-IP;

# Buckets are sized for a marketing site: generous for pages, tight for the
# things that cost something. The edge has its own limits in front of these.
limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=forms:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Front end
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vitaqueen.com www.vitaqueen.com;

    ssl_certificate     /etc/ssl/vitaqueen/origin.pem;
    ssl_certificate_key /etc/ssl/vitaqueen/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # The application sets CSP with a per-request nonce; adding a second,
    # weaker policy here would only widen it.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    server_tokens off;
    client_max_body_size 2m;      # the front end accepts no uploads at all
    limit_conn conns 24;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Brotli where the module is available; gzip is the floor.
    # brotli on; brotli_types text/css application/javascript application/json;

    # Immutable build assets. Hashed filenames, so a year is safe.
    #
    # The forwarded headers matter here as much as on the page route: the app
    # decides whether to send HSTS from X-Forwarded-Proto, and an asset request
    # that arrives without it looks like plain HTTP.
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        limit_req zone=pages burst=60 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vitaqueen.com;

    ssl_certificate     /etc/ssl/vitaqueen/origin.pem;
    ssl_certificate_key /etc/ssl/vitaqueen/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/vitaqueen/api/current/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Large enough for a certificate scan, small enough that nobody uses the
    # API as free storage. Must stay in step with MediaService's own limits.
    client_max_body_size 24m;
    limit_conn conns 16;

    location / {
        limit_req zone=api burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The contact endpoint: one request per second, burst of three.
    location = /api/v1/contact {
        limit_req zone=forms burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # The admin API is not something the public internet needs. Restrict it to
    # the office range and the VPN, and let Cloudflare Access sit in front too.
    location /api/v1/admin/ {
        # allow 203.0.113.0/24;   # office
        # allow 198.51.100.7;     # VPN exit
        # deny all;
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-vitaqueen.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Uploads are stored outside the document root and images are served from
    # here by an internal redirect. Nothing under this prefix is ever executed:
    # `internal` means only the application can trigger it, and there is no PHP
    # handler in scope.
    location /media/ {
        internal;
        alias /var/www/vitaqueen/api/shared/storage/app/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # A file that somehow arrived with a script extension is still inert.
        location ~* \.(php|phar|phtml|pl|py|cgi|sh)$ { deny all; }
    }

    # Documents (certificates, analyses) are private and only reachable through
    # a signed URL the application generates.
    location /documents/ {
        internal;
        alias /var/www/vitaqueen/api/shared/storage/app/documents/;
        add_header Cache-Control "private, max-age=0, no-store" always;
    }

    # Nothing else is anyone's business.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(storage|vendor|bootstrap|config|database|tests)/ { deny all; }
    location = /.env { deny all; }
}
