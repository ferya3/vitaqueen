# ---------------------------------------------------------------------------
# VitaQueen — origin nginx
#
# Sits behind Cloudflare. One application: Next.js under pm2 on 127.0.0.1:3000
# serves the public site, the admin panel at /admin and uploaded media at
# /uploads. The SQLite database is a file on this machine, not a network
# service, so there is nothing else to expose — see docs/security.md.
#
#   Internet → Cloudflare (WAF, DDoS, cache) → nginx → Next.js (pm2)
# ---------------------------------------------------------------------------

# Only Cloudflare may reach the origin. Everything else gets a 403 before it
# touches an application process. Refresh from
# https://www.cloudflare.com/ips-v4 and /ips-v6 with the deploy script.
include /etc/nginx/cloudflare-ips.conf;   # set_real_ip_from … ;
real_ip_header CF-Connecting-IP;

# Buckets are sized for a marketing site: generous for pages, tight for the
# things that cost something. The edge has its own limits in front of these.
limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
# Server Actions (the contact form, every admin save) are POSTs to the page's
# own URL. Keying this zone on the method means GETs carry an empty key, which
# nginx does not count, so only form submissions share the tight bucket.
map $request_method $form_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $form_limit_key zone=forms:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Front end
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vitaqueen.com www.vitaqueen.com;

    ssl_certificate     /etc/ssl/vitaqueen/origin.pem;
    ssl_certificate_key /etc/ssl/vitaqueen/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # The application sets CSP with a per-request nonce; adding a second,
    # weaker policy here would only widen it.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    server_tokens off;
    client_max_body_size 2m;      # public forms carry text only; /admin raises this
    limit_conn conns 24;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Brotli where the module is available; gzip is the floor.
    # brotli on; brotli_types text/css application/javascript application/json;

    # Immutable build assets. Hashed filenames, so a year is safe.
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Uploads, served by the application from DATA_DIR/uploads with random,
    # never-reused names. The route only answers paths of the exact shape the
    # uploader writes; nothing under it is ever executed.
    location /uploads/ {
        limit_req zone=pages burst=60 nodelay;
        include /etc/nginx/snippets/vitaqueen-proxy.conf;
        access_log off;
    }

    # The admin panel. Not something the public internet needs: restrict it to
    # the office range and the VPN, and put Cloudflare Access in front too.
    location /admin {
        # allow 203.0.113.0/24;   # office
        # allow 198.51.100.7;     # VPN exit
        # deny all;
        limit_req zone=admin burst=30 nodelay;
        limit_req zone=forms burst=10 nodelay;
        # Room for an image (12 MB) or PDF (20 MB) per field; the application
        # enforces the per-file limits. Keep in step with next.config.ts.
        client_max_body_size 40m;
        include /etc/nginx/snippets/vitaqueen-proxy.conf;
    }

    location / {
        limit_req zone=pages burst=60 nodelay;
        # The contact form: one submission a second, burst of three.
        limit_req zone=forms burst=3 nodelay;
        include /etc/nginx/snippets/vitaqueen-proxy.conf;
    }
}
