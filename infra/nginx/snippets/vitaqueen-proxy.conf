# Shared proxy settings for every location that forwards to Next.js.
# Install as /etc/nginx/snippets/vitaqueen-proxy.conf.
proxy_pass http://nextjs;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
# Overwritten, never appended: the application trusts these for rate limits
# and the audit log, so a client must not be able to supply its own.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
proxy_read_timeout 60s;
