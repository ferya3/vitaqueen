# The statistical classifier, backed by Redis. It is worth more than every
# other rule here after a few weeks of real mail — and worth nothing on day
# one, which is why the reject threshold starts where it does.
#
# Teach it by hand when it is wrong:
#   rspamc learn_spam  < message.eml
#   rspamc learn_ham   < message.eml
backend = "redis";
autolearn = [-5, 10];
new_schema = true;
expire = 8640000;
