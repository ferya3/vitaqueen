# X-Spam is what the after-Sieve rule reads to file a message into Junk.
# X-Spamd-Result is what you read at 3 a.m. to find out why a message scored
# the way it did — the single most useful header on this server.
# The routine is "spam-header" — rspamadm configtest rejects any name that is
# not one of its own, which is the cheapest way to find that out.
use = ["spam-header", "x-spam-level", "x-spamd-result", "authentication-results"];
authenticated_headers = ["authentication-results"];

# Our own outbound mail carries none of this. Publishing your spam scores to
# the people you write to is an odd thing to do.
skip_authenticated = true;
skip_local = true;

extended_spam_headers = true;

# Pinned, not left to the default. The "spam-header" routine ships as
# `Deliver-To: Junk`, which the after-Sieve rule does not look at — the two
# would have disagreed silently and every spam message would have landed in
# the inbox. Check with: rspamadm configdump milter_headers
routines {
  spam-header {
    header = "X-Spam";
    value = "Yes";
    remove = 0;
  }
}
