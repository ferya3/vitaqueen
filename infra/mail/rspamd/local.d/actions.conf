# The three thresholds that decide what happens to a message.
#
#   ≥ 15  rejected during the SMTP conversation — the sender's server tells its
#         own user, and no backscatter leaves this host
#   ≥  6  delivered, marked, filed to Junk by the after-Sieve rule
#   ≥  4  greylisted: come back in five minutes. Bulk senders mostly do not.
#
# Raise `reject` before you lower it. A false positive at this threshold is a
# lost order; a false negative is a message in the Junk folder.
reject = 15;
add_header = 6;
greylist = 4;
