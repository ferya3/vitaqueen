# "Come back in five minutes." Real senders retry; a large share of bulk spam
# never does. It costs a first-time correspondent one delay, once.
#
# If a distributor complains about delays, whitelist their domain in
# /etc/rspamd/local.d/multimap.conf rather than turning this off.
enabled = true;
timeout = 5min;
expire = 1d;
key_prefix = "rg";
message = "Greylisted, please retry shortly";
