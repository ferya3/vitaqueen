# The limit that bounds the damage when — not if — a password leaks. Everything
# else on this host reduces the chance of a compromise; this decides what a
# successful one costs.
rates {
  # Authenticated senders. Far above any human's day, far below a spam run.
  user = {
    bucket = [
      { burst = 40; rate = "200 / 1h"; }
    ];
  }

  # Bounces aimed at a single address: the shape of a backscatter storm.
  bounce_to = {
    bucket = [
      { burst = 10; rate = "2 / 1m"; }
    ];
  }
}

whitelisted_rcpts = "postmaster,mailer-daemon";
symbol = "RATELIMITED";

# A tighter cap for the application account alone needs a per-user override in
# local.d/settings.conf, and the selector syntax differs between Rspamd
# versions — check `rspamadm configdump settings` before relying on one. The
# application's own limits (nginx `forms` zone, Laravel's throttle) are the
# first line for that path in any case.
