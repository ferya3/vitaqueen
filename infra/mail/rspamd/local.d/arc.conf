# ARC preserves an authentication verdict across a forward. It matters the day
# an alias forwards mail to somewhere else: without it, the forwarded message
# arrives with SPF broken by the forwarding hop and DMARC failing on mail that
# was genuine when it reached us.
enabled = true;
use_domain = "envelope";
use_esld = false;
allow_hdrfrom_mismatch = true;
sign_authenticated = false;
sign_local = false;
sign_inbound = true;
selector = "mail";
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
