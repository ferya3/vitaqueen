# ClamAV over its local socket. The recipients here open PDFs and spreadsheets
# sent by strangers who want to buy something — this is not a theoretical risk.
clamav {
  type = "clamav";
  servers = "/var/run/clamav/clamd.ctl";
  scan_mime_parts = true;
  scan_text_mime = false;
  symbol = "CLAM_VIRUS";
  action = "reject";
  message = "Message contains a virus and was rejected";
  patterns {
    JUST_EICAR = "^Eicar-Test-Signature$";
  }
}
