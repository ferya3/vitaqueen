# Outbound DKIM signing.
#
# Signing is keyed on the *envelope* domain so that application mail — which
# leaves with a Return-Path at __BOUNCE_DOMAIN__ but a From: at
# __MAIL_DOMAIN__ — is signed with its own key and can be revoked on its own.
# Both still align under relaxed DMARC because the organisational domain
# matches. See "Identity: who signs what" in docs/email.md.
enabled = true;

use_domain = "envelope";

# Do not collapse a subdomain to its registered domain: that is precisely the
# distinction the two keys exist to preserve.
use_esld = false;

# Required for the split above: the header From: domain and the signing domain
# legitimately differ on the application path. Postfix already constrains which
# envelope sender each login may use (smtpd_sender_login_maps), which is the
# check that actually matters.
allow_hdrfrom_mismatch = true;
allow_username_mismatch = true;

sign_authenticated = true;
sign_local = true;
sign_inbound = false;

selector = "mail";
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

domain {
  __MAIL_DOMAIN__ {
    selector = "mail";
    path = "/var/lib/rspamd/dkim/__MAIL_DOMAIN__.mail.key";
  }
  __BOUNCE_DOMAIN__ {
    selector = "app";
    path = "/var/lib/rspamd/dkim/__BOUNCE_DOMAIN__.app.key";
  }
}
