# ---------------------------------------------------------------------------
# nginx on the mail host: webmail, client auto-configuration, and the MTA-STS
# policy file.
#
# This is the only HTTP on this machine. The mail services themselves need
# nothing from nginx — certificates are issued over DNS-01 or a brief
# standalone listener, so port 80 exists here only to redirect.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=webmail:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __MAIL_HOSTNAME__ webmail.__MAIL_DOMAIN__ autoconfig.__MAIL_DOMAIN__ autodiscover.__MAIL_DOMAIN__ mta-sts.__MAIL_DOMAIN__;
    return 301 https://$host$request_uri;
}

# --- Webmail ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmail.__MAIL_DOMAIN__ __MAIL_HOSTNAME__;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MailSSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root __ROUNDCUBE_ROOT__;
    index index.php;
    client_max_body_size 50m;   # must not be smaller than message_size_limit

    # Webmail is a login form on the public internet. Generous for a human,
    # tight for a script.
    limit_req zone=webmail burst=20 nodelay;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(config|temp|logs|SQL|bin|installer)/ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}

# --- Client auto-configuration ---------------------------------------------
# Thunderbird reads autoconfig; Outlook posts to autodiscover. Both are static
# answers — the settings do not depend on who is asking.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoconfig.__MAIL_DOMAIN__ autodiscover.__MAIL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    root /var/www/mail-autoconfig;

    location = /mail/config-v1.1.xml {
        default_type application/xml;
        try_files /config-v1.1.xml =404;
    }

    location ~* ^/autodiscover/autodiscover\.xml$ {
        default_type application/xml;
        try_files /autodiscover.xml =404;
    }

    location / { return 404; }
}

# --- MTA-STS policy --------------------------------------------------------
# Sending servers fetch this over HTTPS before they will enforce TLS to us. The
# hostname must be exactly mta-sts.<domain> and the path exactly this one.
#
# Where a separate web origin already terminates TLS for the domain, move this
# block there instead — see nginx/mta-sts.conf. It is the same five lines, and
# the policy then survives the mail host being rebuilt.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.__MAIL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        alias /var/www/mta-sts/mta-sts.txt;
    }

    location / { return 404; }
}
