# ---------------------------------------------------------------------------
# MTA-STS policy, served by the *web* origin rather than the mail host.
#
# Drop this next to infra/nginx/vitaqueen.conf when the site already terminates
# TLS for the domain. The policy then stays reachable even while the mail host
# is being rebuilt, and it may sit behind Cloudflare — unlike anything that
# speaks SMTP.
#
# The file itself is written by install-mail.sh; copy it across, or create it:
#
#   version: STSv1
#   mode: testing
#   mx: mail.example.com
#   max_age: 604800
#
# Change `id` in the _mta-sts TXT record every single time this file changes.
# A sender that has cached the old policy will not look again until you do.
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.__MAIL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_DOMAIN__/privkey.pem;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        alias /var/www/mta-sts/mta-sts.txt;
    }

    location / { return 404; }
}
