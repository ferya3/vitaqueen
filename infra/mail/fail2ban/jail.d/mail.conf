# ---------------------------------------------------------------------------
# fail2ban — mail host
#
# backend = systemd because Ubuntu 24.04 has no /var/log/mail.log until rsyslog
# is installed, and a jail pointed at a file that does not exist fails at
# start-up in a way nobody notices. install-mail.sh installs rsyslog anyway,
# for the humans; the jails read the journal, which is there either way.
#
# This is the second lock. Rspamd's rate limits are the first, and the one that
# bounds the damage from a password that has already leaked.
# ---------------------------------------------------------------------------

[DEFAULT]
backend = systemd
bantime = 1h
findtime = 10m
maxretry = 5
# Never lock yourself out of your own submission port.
ignoreip = 127.0.0.1/8 ::1 __TRUSTED_CIDRS__

[postfix]
enabled = true
mode = aggressive

[dovecot]
enabled = true

[sieve]
enabled = true

# Anyone who has earned three bans gets a week off.
[recidive]
enabled = true
bantime = 7d
findtime = 1d
maxretry = 3
