# ---------------------------------------------------------------------------
# Dovecot — VitaQueen mail host
#
# Installed as /etc/dovecot/local.conf, which Debian's dovecot.conf includes
# last, so everything here wins over conf.d/* without those files being edited.
# That is deliberate: the distribution keeps ownership of its defaults and this
# file is the entire diff.
#
# Written for Dovecot 2.3.x (Ubuntu 24.04, Debian 12). 2.4 rewrote the
# configuration language — do not carry this file forward unread.
# ---------------------------------------------------------------------------

protocols = imap lmtp sieve
login_greeting = Ready.
postmaster_address = postmaster@__MAIL_DOMAIN__
hostname = __MAIL_HOSTNAME__

# --- Storage ---------------------------------------------------------------
# One Maildir per address under /var/vmail/<domain>/<user>. Maildir rather than
# mdbox because a Maildir is one file per message: when something goes wrong at
# three in the morning, `grep` and `cp` are a recovery plan.
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000
mail_plugins = $mail_plugins quota
mail_max_userip_connections = 20

namespace inbox {
  inbox = yes

  # auto = subscribe, not just create: a folder the client has not subscribed
  # to is a folder the user cannot see, and "my Sent mail is missing" is the
  # support call that follows.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# --- Accounts --------------------------------------------------------------
# A passwd-file, not a database. Fifteen mailboxes do not justify a MySQL
# instance to patch, back up and monitor on the mail host; `bin/mailbox`
# maintains this file and the two Postfix maps together.
#
# Per-user overrides go in the extra-fields column, e.g.
#   userdb_quota_rule=*:storage=10G
passdb {
  driver = passwd-file
  args = scheme=__PASSWORD_SCHEME__ username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

auth_mechanisms = plain login
auth_username_format = %Lu
disable_plaintext_auth = yes

# --- TLS -------------------------------------------------------------------
ssl = required
ssl_cert = </etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem
ssl_key = </etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no

# --- Services --------------------------------------------------------------
service lmtp {
  # Postfix hands every virtual delivery here. The socket lives inside
  # Postfix's chroot, which is why the path looks the way it does.
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  # Postfix asks Dovecot to check submission passwords over this socket.
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service imap-login {
  # Port 0 disables cleartext IMAP entirely rather than relying on
  # disable_plaintext_auth to refuse the login afterwards.
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  service_count = 0
  process_min_avail = 2
}

# POP3 is not offered at all. A protocol whose normal mode of operation is to
# move the mail onto one laptop is a protocol that quietly opts a mailbox out
# of the backups.
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 0
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# --- Filtering and quota ---------------------------------------------------
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

plugin {
  # The user's own rules run first; ours run after and file what Rspamd marked.
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_after = /etc/dovecot/sieve/after.d

  quota = maildir:User quota
  quota_rule = *:storage=__QUOTA__
  quota_rule2 = Trash:storage=+10%%
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}
